name: ActiveShop to Shoptet feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,9,13,17,21 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate XML
        run: python generate_feed.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload XML
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
